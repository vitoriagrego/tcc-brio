<ion-content class="settings-content">
  <div class="background-overlay">
    
    <!-- Botão de Voltar -->
    <div class="header-action">
      <ion-button fill="clear" (click)="goBack()" class="back-btn">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Título da Página -->
    <div class="title-card">
      <h1>Configurações</h1>
    </div>

    <!-- Lista de Opções -->
    <ion-list lines="none" class="settings-list">
      
      <!-- Notificações -->
      <ion-item button [routerLink]="['/notificacao']" detail="false" class="menu-item">
        <ion-icon name="notifications-outline" slot="start"></ion-icon>
        <ion-label>Notificações</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <!-- Backup e Sincronização -->
      <ion-item button [routerLink]="['/backup-sincronizacao']" detail="false" class="menu-item">
        <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
        <ion-label>Backup e Sincronização</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <!-- Tema (Alterna ao clicar no botão, sem ir para outra tela) -->
      <ion-item button (click)="alternarTema()" detail="false" class="menu-item">
        <ion-icon name="color-palette-outline" slot="start"></ion-icon>
        <ion-label>Tema</ion-label>
        <span class="item-value" slot="end">{{ temaAtual }}</span>
        <ion-icon name="swap-horizontal-outline" slot="end"></ion-icon>
      </ion-item> 

      <!-- Idioma (Dinâmico) -->
      <ion-item button [routerLink]="['/idioma']" detail="false" class="menu-item">
        <ion-icon name="globe-outline" slot="start"></ion-icon>
        <ion-label>Idioma</ion-label>
        <span class="item-value" slot="end">{{ idiomaAtual }}</span>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <!-- Sons (Dinâmico) -->
      <ion-item button [routerLink]="['/sons']" detail="false" class="menu-item">
        <ion-icon name="musical-notes-outline" slot="start"></ion-icon>
        <ion-label>Ambientação</ion-label>
        <span class="item-value" slot="end">{{ sonsAtivado }}</span>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <!-- Sobre o BRIO -->
      <ion-item button [routerLink]="['/sobre']" detail="false" class="menu-item">
        <ion-icon name="chatbox-ellipses-outline" slot="start"></ion-icon>
        <ion-label>Sobre o BRIO</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

    </ion-list>

    <!-- Botão Sair da Conta -->
    <div class="logout-container">
      <ion-button expand="block" fill="clear" (click)="logout()" class="logout-btn">
        Sair da conta
      </ion-button>
    </div>

  </div>
</ion-content>
