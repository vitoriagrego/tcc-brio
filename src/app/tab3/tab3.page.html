<ion-content [fullscreen]="true" class="tab3-content">

  <div class="main-overlay">

    <!-- ========================================= -->
    <!-- TOPO -->
    <!-- ========================================= -->

    <div class="header-section">

      <div class="back-link">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Transmutação em andamento</span>
      </div>

      <h1 class="activity-title">
        {{ phaseTitle }}
      </h1>

      <div class="top-timer">
        {{ formatTime(secondsLeft) }}
      </div>

    </div>


    <!-- ========================================= -->
    <!-- RELÓGIO -->
    <!-- ========================================= -->

    <div class="clock-area">

      <div class="magic-ring">

        <div class="clock-frame">

          <div class="clock-face">

            <!-- MARCAÇÕES -->

            <span class="clock-dot dot-12"></span>
            <span class="clock-dot dot-1"></span>
            <span class="clock-dot dot-2"></span>
            <span class="clock-dot dot-3"></span>
            <span class="clock-dot dot-4"></span>
            <span class="clock-dot dot-5"></span>
            <span class="clock-dot dot-6"></span>
            <span class="clock-dot dot-7"></span>
            <span class="clock-dot dot-8"></span>
            <span class="clock-dot dot-9"></span>
            <span class="clock-dot dot-10"></span>
            <span class="clock-dot dot-11"></span>


            <!-- NÚMEROS -->

            <span class="num num-12">XII</span>
            <span class="num num-3">III</span>
            <span class="num num-6">VI</span>
            <span class="num num-9">IX</span>


            <!-- PONTEIRO DAS HORAS -->

            <div
              class="hand hour-hand"
              [style.transform]="'rotate(' + hourRotation + 'deg)'">
            </div>


            <!-- PONTEIRO DOS MINUTOS -->

            <div
              class="hand minute-hand"
              [style.transform]="'rotate(' + minuteRotation + 'deg)'">
            </div>


            <!-- CENTRO -->

            <div class="center-pin">
              <div class="center-gem"></div>
            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- RODAPÉ -->
    <!-- ========================================= -->

    <div class="footer-section">

      <p class="quote">
        "A concentração é o ingrediente secreto da manifestação."
      </p>


      <div class="timer-controls-panel">

        <!-- INICIAR / PAUSAR / CONTINUAR -->

        <div
          class="control-btn-wrapper"
          (click)="togglePause()">

          <button
            class="btn-circle"
            type="button">

            <ion-icon
              [name]="isRunning ? 'pause-sharp' : 'play-sharp'">
            </ion-icon>

          </button>

          <span class="btn-label">

            {{
              isRunning
                ? 'Pausar'
                : (hasStarted ? 'Continuar' : 'Iniciar')
            }}

          </span>

        </div>


        <!-- PULAR PAUSA -->

        <div
          class="control-btn-wrapper"
          (click)="skipToBreak()">

          <button
            class="btn-circle btn-skip"
            type="button">

            <ion-icon
              name="play-forward-sharp">
            </ion-icon>

          </button>

          <span class="btn-label">
            Pular pausa
          </span>

        </div>


        <!-- TEMPO -->

        <div class="live-timer">
          {{ formatTime(secondsLeft) }}
        </div>


        <!-- FINALIZAR -->

        <div
          class="control-btn-wrapper"
          (click)="stopTimer()">

          <button
            class="btn-circle btn-stop"
            type="button">

            <div class="stop-icon"></div>

          </button>

          <span class="btn-label">
            Finalizar
          </span>

        </div>

      </div>

    </div>

  </div>

</ion-content>
