<ion-content [fullscreen]="true" class="tab3-content">

  <div class="main-overlay">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="header-section">

      <div class="back-link">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Transmutação em andamento</span>
      </div>

      <h1 class="activity-title">
        Estudar alquimia
      </h1>

      <!-- TIMER SUPERIOR -->
      <div class="top-timer">
        {{ formatTime(secondsLeft) }}
      </div>


      <div class="task-card">

        <div class="task-info">

          <span class="task-name">
            ESTUDAR PARA A PROVA DE BIOLOGIA
          </span>

          <span class="task-duration">
            1h30m
          </span>

        </div>

        <div class="wax-seal">

          <div class="seal-gem"></div>

        </div>

      </div>

    </div>


    <!-- ========================= -->
    <!-- RELÓGIO -->
    <!-- ========================= -->

    <div class="clock-frame">

      <div class="clock-face">

        <span class="num num-12">XII</span>
        <span class="num num-3">III</span>
        <span class="num num-6">VI</span>
        <span class="num num-9">IX</span>


        <div
          class="hand hour-hand"
          [style.transform]="'rotate(' + hourRotation + 'deg)'">
        </div>


        <div
          class="hand minute-hand"
          [style.transform]="'rotate(' + minuteRotation + 'deg)'">
        </div>


        <div class="center-pin"></div>

      </div>

    </div>


    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <div class="footer-section">

      <p class="quote">
        "A concentração é o ingrediente secreto da manifestação."
      </p>


      <div class="timer-controls-panel">


        <!-- PAUSAR / CONTINUAR -->

        <div
          class="control-btn-wrapper"
          (click)="togglePause()">

          <button class="btn-circle">

            <ion-icon
              [name]="isPaused ? 'play-sharp' : 'pause-sharp'">
            </ion-icon>

          </button>

          <span class="btn-label">
            {{ isPaused ? 'Continuar' : 'Pausar' }}
          </span>

        </div>


        <!-- TIMER -->

        <div class="live-timer">

          {{ formatTime(secondsLeft) }}

        </div>


        <!-- FINALIZAR -->

        <div
          class="control-btn-wrapper"
          (click)="stopTimer()">

          <button class="btn-circle btn-stop">

            <div class="stop-icon"></div>

          </button>

          <span class="btn-label">
            Finalizar
          </span>

        </div>

      </div>


    </div>

  </div>

</ion-content>
