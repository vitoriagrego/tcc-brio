<ion-content [fullscreen]="true" class="grimorio-container">

  <!-- Botão Voltar -->
  <button class="btn-back" (click)="voltarTab2()">
    <ion-icon name="arrow-back-outline"></ion-icon>
    <span>VOLTAR</span>
  </button>

  <div class="livro-viewport">
    
    <div class="pagina-base">
      <img src="assets/grim1.png" alt="Livro Base" class="bg-pagina-img">
      <div class="pagina-conteudo">
        <div
          class="runa-item"
          *ngFor="let runa of runasPaginaAtual"
          [class.bloqueada]="!runa.desbloqueada"
          [class.nova]="runa.nova"
        >
          <div class="runa-icon-container">
            <img [src]="runa.icone" [alt]="runa.nome" class="runa-img" (error)="$event.target.style.display='none'">
          </div>
          <div class="runa-details">
            <h2>
              {{ runa.nome }}
              <span class="runa-novo" *ngIf="runa.nova">NOVA</span>
            </h2>

            <!-- desbloqueada: descrição da runa -->
            <p *ngIf="runa.desbloqueada">{{ runa.descricao }}</p>

            <!-- bloqueada: como conquistar + progresso -->
            <ng-container *ngIf="!runa.desbloqueada">
              <p>{{ runa.dica }}</p>
              <div class="runa-prog-linha">
                <div class="runa-prog">
                  <div class="runa-prog-fill" [style.width.%]="percentual(runa)"></div>
                </div>
                <span class="runa-prog-texto">{{ runa.valor }}/{{ runa.meta }}</span>
              </div>
            </ng-container>
          </div>
        </div>

        <!-- estados de carregamento / erro / vazio -->
        <p class="runas-estado" *ngIf="carregando && todasRunas.length === 0">Folheando o grimório...</p>
        <p class="runas-estado" *ngIf="erro">
          Não foi possível carregar as runas.
          <button type="button" (click)="carregar()">Tentar de novo</button>
        </p>
      </div>
    </div>

    <div class="folha-overlay" [class.animar-virada]="folhaVirando">
      <img src="assets/grim1.png" alt="Folha Virando" class="bg-pagina-img">
    </div>

    <div class="controles-paginacao">
      <button class="btn-pag" (click)="paginaAnterior()" [disabled]="paginaAtual === 0 || animando">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>
      <span class="num-pagina">{{ paginaAtual + 1 }}/{{ totalPaginas || 1 }}</span>
      <button class="btn-pag" (click)="proximaPagina()" [disabled]="paginaAtual >= totalPaginas - 1 || animando">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>

  </div>

  <button class="btn-proximo-lado" (click)="irParaGrim2()" aria-label="Avançar lado do livro">
    <ion-icon name="chevron-forward-circle-outline"></ion-icon>
  </button>

</ion-content>
