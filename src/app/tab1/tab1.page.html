<ion-content [fullscreen]="true">
  <div class="background">
    <!-- TOPO PERFIL CONECTADO -->
    <div class="headerTotal">
      <div class="header">
        <div class="perfil">
          <a href="tabs/tab5">
            <img [src]="perfil?.avatar_url || 'assets/perfil.png'" alt="avatar">
          </a>
          <div class="dados" [routerLink]="['/tabs/tab4']">
            <h2>{{ perfil?.nickname || 'Aprendiz' }}</h2>
            <p>Nível {{ perfil?.nivel || 1 }}</p>
            <div class="xp-bar">
              <div class="xp-fill" [style.width.%]="xpPorcentagem"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="acoes">
        <a href="/relaxamento">
          <ion-icon name="leaf-outline"></ion-icon>
        </a>
        <a href="config">
          <ion-icon name="settings-outline"></ion-icon>
        </a>
      </div>
    </div>

    <!-- LIVRO + ESTUDOS -->
    <div class="livro">
      <div class="conteudo-livro">
        <br><br>
        <h2>Estudos do dia</h2>

        <a href="/grim2">
          <div class="tarefa">
            <div class="texto">
              <h3>Estudar para a prova de Biologia</h3>
              <p>1h30m</p>
            </div>
          </div>
        </a>

        <a href="/grim2">
          <div class="tarefa">
            <div class="texto">
              <h3>Leitura longa e profunda</h3>
              <p>2 horas</p>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- RESUMO -->
    <div class="resumo">
      <h2>Resumo do dia</h2>

      <div class="cards">
        <div class="card-info">
          <span>Estudos</span>
          <h3>1/3</h3>
        </div>

        <!-- Chama Viva conectada ao campo ofensiva_dias -->
        <div class="card-info">
          <span>Chama Viva</span>
          <h3>{{ perfil?.ofensiva_dias || 0 }} dias</h3>
        </div>

        <!-- Foco Total conectado ao tempo_foco_maximo_dia -->
        <div class="card-info">
          <span>Foco Total</span>
          <h3>{{ focoTotal }}</h3>
        </div>
      </div>
    </div>
  </div>
</ion-content>
