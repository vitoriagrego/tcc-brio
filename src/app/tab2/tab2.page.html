<ion-content [fullscreen]="true" class="estudo-container">
  
  <!-- Botão e Rótulo "Matérias" (Estante Superior Esquerda) -->
  <button class="btn-interativo btn-estante" (click)="abrirEstante()" aria-label="Matérias">
    <div class="glow-effect"></div>
    <span class="tooltip-label">Matérias</span>
  </button>

  <!-- Container Redimensionado e Elevado para a Mesa -->
  <div class="center-elements-container">
    
    <!-- Arte Renderizada -->
    <img src="assets/naosei.png" alt="Livro Grimoire" class="img-grimorio">

    <!-- Botão Fogo Esquerdo (Guilda) -->
    <button class="btn-interativo btn-fogo-esquerdo" (click)="abrirGuilda()" aria-label="Guilda">
      <div class="pulse-aura"></div>
    </button>

    <!-- Botão Fogo Direito (Espírito Alquímico) -->
    <button class="btn-interativo btn-fogo-direito" (click)="abrirIA()" aria-label="Espírito Alquímico">
      <div class="pulse-aura"></div>
    </button>

    <!-- Botão Clicável do Livro -->
    <button class="btn-interativo btn-livro-mesa" (click)="abrirLivroMesa()" aria-label="Estudar">
      <div class="glow-book"></div>
      <span class="tooltip-label tooltip-estudar">Estudar</span>
    </button>

  </div>

</ion-content>
