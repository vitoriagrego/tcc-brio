<ion-content [fullscreen]="true" class="editar-perfil-content">

  <div class="background-overlay">

    <!-- CABEÇALHO -->
    <div class="header-editar">
      <button class="back-button" type="button" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>Editar Perfil</h1>
      <div class="spacer"></div>
    </div>

    <!-- PREVIEW DO AVATAR SELECIONADO -->
    <div class="preview-section">
      <div class="avatar-preview-container">
        <img [src]="avatarSelecionado" alt="Avatar Selecionado" class="avatar-preview-img">
        <div class="preview-badge" *ngIf="isAvatarBloqueado(avatarSelecionado)">
          <ion-icon name="lock-closed"></ion-icon>
        </div>
      </div>
      <p class="preview-label">Prévia do Avatar</p>
    </div>

    <!-- CAMPO NICKNAME -->
    <div class="form-group">
      <label for="nickname">Nome de Alquimista:</label>
      <div class="input-container">
        <ion-icon name="person-outline"></ion-icon>
        <input 
          id="nickname" 
          type="text" 
          [(ngModel)]="nickname" 
          maxlength="30" 
          placeholder="Seu nickname..." 
          class="custom-input" />
      </div>
    </div>

    <!-- SELEÇÃO DE AVATARES -->
    <div class="avatares-section">
      <div class="secao-header">
        <label>Escolha seu Avatar:</label>
        <span class="plano-info-badge" [class.badge-gold]="planoUsuario === 'premium'">
          {{ planoUsuario === 'premium' ? 'TODOS LIBERADOS ⭐' : '3 BLOQUEADOS (PREMIUM)' }}
        </span>
      </div>

      <div class="avatares-grid">
        <div 
          *ngFor="let av of opcoesAvatares; let i = index" 
          class="avatar-item" 
          [class.avatar-selecionado]="avatarSelecionado === av"
          [class.avatar-item-bloqueado]="isAvatarBloqueado(av)"
          (click)="selecionarAvatar(av)">

          <img [src]="av" [alt]="'Avatar ' + (i + 1)" class="avatar-thumb" />

          <!-- OVERLAY DE BLOQUEIO PARA AVATARES PREMIUM -->
          <div class="bloqueio-overlay" *ngIf="isAvatarBloqueado(av)">
            <ion-icon name="lock-closed"></ion-icon>
            <span class="tag-premium-mini">PREMIUM</span>
          </div>

          <!-- CHECKMARK DE SELECIONADO -->
          <div class="check-overlay" *ngIf="avatarSelecionado === av && !isAvatarBloqueado(av)">
            <ion-icon name="checkmark-circle"></ion-icon>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTÃO SALVAR -->
    <div class="acoes-section">
      <button 
        class="btn-salvar-perfil" 
        type="button" 
        [disabled]="salvando" 
        (click)="salvarPerfil()">
        <ion-spinner *ngIf="salvando" name="dots"></ion-spinner>
        <span *ngIf="!salvando">Salvar Alterações</span>
      </button>
    </div>

  </div>

</ion-content>
