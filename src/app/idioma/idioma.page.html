<ion-content class="settings-content">
  <div class="background-overlay">
    
    <!-- Botão de Voltar -->
    <div class="header-action">
      <ion-button fill="clear" (click)="goBack()" class="back-btn">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Título da Página -->
    <div class="title-card">
      <h1>Idioma</h1>
    </div>

    <!-- Lista de Seleção de Idioma -->
    <ion-list lines="none" class="settings-list">
      
      <ion-item 
        *ngFor="let item of idiomas" 
        button 
        (click)="selecionarIdioma(item.nome)" 
        detail="false" 
        class="menu-item"
        [class.selected]="idiomaSelecionado === item.nome">
        
        <ion-icon name="globe-outline" slot="start"></ion-icon>
        
        <ion-label>
          <h2>{{ item.nome }}</h2>
          <p>{{ item.sigla }}</p>
        </ion-label>

        <ion-icon 
          *ngIf="idiomaSelecionado === item.nome" 
          name="checkmark-circle" 
          slot="end" 
          class="check-icon">
        </ion-icon>
      </ion-item>

    </ion-list>

  </div>
</ion-content>
