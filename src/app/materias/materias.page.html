<ion-content [fullscreen]="true" class="materias-content">
  <!-- Imagem de Fundo em camada separada -->
  <div class="bg-overlay"></div>

  <div class="main-overlay">
    <div class="top-bar">
      <button class="back-button" (click)="voltar()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </div>

    <div class="filters-scroll">
      <button 
        class="filter-chip" 
        [class.active]="filtroSelecionado === 'todas'"
        (click)="selecionarFiltro('todas')">
        Todas
      </button>

      <button 
        class="filter-chip" 
        [class.active]="filtroSelecionado === 'favoritas'"
        (click)="selecionarFiltro('favoritas')">
        Favoritas
      </button>

      <button 
        class="filter-chip" 
        [class.active]="filtroSelecionado === 'humanas'"
        (click)="selecionarFiltro('humanas')">
        Humanas
      </button>

      <button 
        class="filter-chip" 
        [class.active]="filtroSelecionado === 'biologicas'"
        (click)="selecionarFiltro('biologicas')">
        Biológicas
      </button>
    </div>

    <div class="cards-grid">
      <div class="materia-card" *ngFor="let materia of materiasFiltradas">
        
        <h3 class="materia-title">{{ materia.nome }}</h3>

        <div class="icon-frame">
          <img [src]="materia.imagem" [alt]="materia.nome" class="materia-icon" (error)="materia.imagem = 'assets/icones/matematica.png'" />
        </div>

        <div class="progress-section">
          <div class="level-info">
            <span class="level-text">Nível {{ materia.nivel }}</span>
            <span class="percentage-text">{{ materia.progresso }}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" [style.width.%]="materia.progresso"></div>
          </div>
        </div>

        <div class="actions-group">
          <button class="btn-action btn-estudar" (click)="estudarMateria(materia)">
            Estudar
          </button>
          <button class="btn-action btn-exercicios" (click)="exerciciosMateria(materia)">
            Exercícios
          </button>
        </div>

      </div>
    </div>

  </div>
</ion-content>
