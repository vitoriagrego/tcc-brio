<ion-content class="settings-content">
  <div class="background-overlay">
    
    <!-- Botão de Voltar -->
    <div class="header-action">
      <ion-button fill="clear" (click)="goBack()" class="back-btn">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Título da Página -->
    <div class="title-card">
      <h1>Ambientação</h1>
    </div>

    <!-- Lista de Sons -->
    <ion-list lines="none" class="settings-list">
      
      <ion-item 
        *ngFor="let item of sons" 
        button 
        (click)="toggleSom(item)" 
        detail="false" 
        class="menu-item"
        [class.active-item]="item.ativo">
        
        <ion-icon name="musical-notes-outline" slot="start"></ion-icon>
        
        <ion-label>{{ item.nome }}</ion-label>

        <span class="status-text" slot="end" *ngIf="item.ativo">Ativado</span>
        
        <ion-icon name="chevron-forward-outline" slot="end" class="arrow-icon"></ion-icon>
      </ion-item>

    </ion-list>

  </div>
</ion-content>
